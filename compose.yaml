# Upstream Kuma without Home Assistant. Full guide: docs/docker.md
#
#   docker compose up -d
#
# then open http://<this-machine>:8099 and create the admin account (do that
# first: until then, whoever opens it can). Put HTTPS in front of it before
# opening it to the internet (see the guide).
services:
  upstream-kuma:
    # Pin a version (e.g. :0.5.1) to update only when you choose to.
    image: ghcr.io/big-barlowe/upstream-kuma:latest
    # To build from source instead (local changes), replace the image line
    # with one of these and use `docker compose up -d --build`:
    # build: ./upstream_kuma
    # build: https://github.com/big-barlowe/upstream-kuma.git#main:upstream_kuma
    container_name: upstream-kuma
    restart: unless-stopped
    ports:
      - "8099:8099"
    volumes:
      # The SQLite database lives here; back up this folder.
      - ./data:/data
    environment:
      # Time zone for timestamps in alert messages and logs.
      TZ: Etc/UTC
      # debug, info, warning or error
      LOG_LEVEL: info
      # Only behind a proxy that signs people in itself: no accounts, everyone
      # is an admin.
      # AUTH: "off"
      # Optional: connect to Home Assistant for "HA entity" monitors and the
      # Home Assistant notification channel. HA_TOKEN is a long-lived access
      # token (your HA profile -> Security).
      # HA_URL: http://homeassistant.local:8123
      # HA_TOKEN: eyJhbGciOi...
    healthcheck:
      test: ["CMD", "wget", "-qO", "/dev/null", "http://localhost:8099/api/info"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
